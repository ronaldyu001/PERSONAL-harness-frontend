<!-- Maia's mark as the application wears it: the same four petals and warm
     core the interface draws (MaiaMark.tsx), flat rather than ramped, because
     this world has no gradients. The plate is the dark ground so the mark
     holds its shape against a taskbar or a tab strip of any colour. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="8" fill="#1B1815" />
  <g fill="#E6E4DC" opacity="0.55">
    <circle cx="16" cy="9.6" r="7" />
    <circle cx="22.4" cy="16" r="7" />
    <circle cx="16" cy="22.4" r="7" />
    <circle cx="9.6" cy="16" r="7" />
  </g>
  <circle cx="16" cy="16" r="2.6" fill="#1B1815" />
</svg>
