<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#151211" />
    <meta name="color-scheme" content="dark light" />
    <title>Maia</title>
    <style>
      html[data-theme='dark'] { background: #241f1a; color-scheme: dark; }
      html[data-theme='light'] { background: #f1eadf; color-scheme: light; }
    </style>
    <script>
      (() => {
        let theme = 'dark'
        let palette = 'salon'
        try {
          const stored = JSON.parse(localStorage.getItem('harness.preferences') || '{}')
          if (stored.theme === 'light' || stored.theme === 'dark') theme = stored.theme
          if (stored.palette === 'salon' || stored.palette === 'print-room' || stored.palette === 'day-office') {
            palette = stored.palette
          }
          if (stored.reduceMotion === true) {
            document.documentElement.dataset.reduceMotion = 'true'
          }
        } catch {}
        document.documentElement.dataset.theme = theme
        document.documentElement.dataset.palette = palette
        const colors = {
          salon: { dark: '#241f1a', light: '#f1eadf' },
          'print-room': { dark: '#101114', light: '#f4efe6' },
          'day-office': { dark: '#24323e', light: '#f4f0e8' },
        }
        document.querySelector('meta[name="theme-color"]')?.setAttribute(
          'content',
          colors[palette][theme],
        )
      })()
    </script>
  </head>
  <body>
    <!--
      DIRECTION CONTRACT - Maia

      THESIS: Maia is a private study for local intelligence: calm, tactile,
      softly lit, and free of cloud-software noise. Conversation is the room;
      supporting readouts are quiet objects at its edge.

      OWN-WORLD: book cloth, smoked glass, warm paper, and the restrained
      geometry of a well-made writing desk. Mineral neutrals, plum and copper
      details, editorial display type, generous radii, and layered light.

      STORY: The owner lands on a face where conversation is the working
      instrument and the unwired inputs sit honestly at rest, then opens the
      conversation without ever losing their place.

      FIRST VIEWPORT: Pinned control column at the left edge. The chat region
      absorbs all remaining width, its legend and composer live. Two dormant
      regions stack at the right, drawn precisely and reading nothing. Regions
      abut; no gutters anywhere.

      FORM: The Panel, candidate 1 of the grounded list, chosen over the roll's
      assignment (Service Manual, index 5).

      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, DESIGN.md, and every shipping raster
      carrying its provenance.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
